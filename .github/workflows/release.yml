# push 到 main 即自增 patch 发版 + 构建并推送 GHCR 镜像；人工打 tag 则发该 tag（不自增）。
#
# 设计要点（对齐组织内 hailuo/jimeng/qwen 的既有实现；每条都有踩坑来源，别随手改）：
#   * 镜像构建与打 tag 必须在**同一个 workflow** 内：GITHUB_TOKEN 推送的 tag 不会触发
#     其他 workflow，拆成两个会留下"有 tag、没镜像"的**静默**半成品；
#   * checkout 一律钉 `github.sha`（分支 push 时 `github.ref` 是会移动的指针）；
#   * 🔴 **先构建 → 容器内冒烟 → 再推送**：冒烟不过就不推 —— GHCR 永不见坏镜像；
#   * 打 tag 放在推镜像之后：构建失败不留下"有 tag、没镜像"；
#   * GHCR 镜像名**必须全小写**；Release 创建做**幂等**（重跑同一 tag 不变红）；
#   * 逃生阀的字面量不得出现在任何要发版的 commit message 里（含"给它写说明"的那次提交）。
name: release

on:
  push:
    branches: [main]
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: '补发一个已存在的 tag（留空 = 按 main 自增 patch）'
        required: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write    # 建 tag 与 Release
  packages: write    # 推 GHCR

jobs:
  resolve:
    runs-on: ubuntu-latest
    # 自我触发兜底（将来换 PAT 才用得上）；workflow_dispatch 无 head_commit，故未在此判逃生阀
    if: ${{ github.actor != 'github-actions[bot]' }}
    outputs:
      mode: ${{ steps.ver.outputs.mode }}
      tag: ${{ steps.ver.outputs.tag }}
      version: ${{ steps.ver.outputs.version }}
      commit: ${{ steps.ver.outputs.commit }}
      image: ${{ steps.ver.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}
          fetch-depth: 0        # 缺了它读不到历史 tag，版本号会永远从 v0.0.1 起
      - id: ver
        shell: bash
        run: |
          set -euo pipefail
          {
            # GHCR 镜像名必须全小写。用 tr 而不是 ${VAR,,} —— 后者是 bash 4+ 特性
            echo "image=ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
            echo "commit=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

          # 逃生阀：**只在 push 事件上生效**。dispatch 是人的显式发版意图。
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            MSG=$(git log -1 --pretty=%B)
            if printf '%s' "$MSG" | grep -qF '[skip release]'; then
              echo "mode=skip" >> "$GITHUB_OUTPUT"
              echo "提交信息命中跳过标记 —— 本次不发版（不产 tag / 镜像 / Release）"
              exit 0
            fi
          fi

          INPUT_TAG="${{ inputs.tag }}"
          if [ -n "$INPUT_TAG" ]; then
            MODE=tag; TAG="$INPUT_TAG"
          elif [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            MODE=tag; TAG="${GITHUB_REF#refs/tags/}"
          else
            MODE=auto
          fi

          if [ "$MODE" = auto ]; then
            LATEST=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
            LATEST=${LATEST:-v0.0.0}          # 冷启动：零 tag 时从 v0.0.0 起算
            CORE="${LATEST#v}"
            MAJOR="${CORE%%.*}"
            REST="${CORE#*.}"
            MINOR="${REST%%.*}"
            PATCH="${REST#*.}"
            PATCH="${PATCH%%[-+]*}"           # 剥掉 -rc.1 这类后缀，否则算术报错
            TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))"
            echo "auto：上一版 $LATEST → 本版 $TAG"
          else
            echo "tag：发布 $TAG"
          fi

          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"   # 镜像 tag 不带 v 前缀

  bump:
    # 版本号写回：`/healthz` 与 FastAPI app 报的 version 来自 app/__init__.py，
    # 只打 tag 会让镜像里的自报版本永远停在旧值 ⇒ auto 模式下把常量改成发布版本，
    # **在构建之前**执行，这样镜像、tag、Release、自报版本四者一致。
    # 人工 tag 模式**不改代码** —— 保证"tag 内容 == 构建内容"。
    needs: resolve
    if: ${{ needs.resolve.outputs.mode != 'skip' }}
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.b.outputs.sha }}
      sha7: ${{ steps.b.outputs.sha7 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          fetch-depth: 0
      - id: b
        env:
          MODE: ${{ needs.resolve.outputs.mode }}
          VERSION: ${{ needs.resolve.outputs.version }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          # annotated tag 与提交都需要 committer 身份（runner 上没有全局 git 配置）
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$MODE" != "auto" ]; then
            echo "人工 tag 模式：不改代码（tag 内容 == 构建内容）"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "sha7=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 - "$VERSION" <<'PY'
          import pathlib, re, sys
          p = pathlib.Path("app/__init__.py")
          t = p.read_text(encoding="utf-8")
          out, n = re.subn(r'__version__ = "[^"]*"', f'__version__ = "{sys.argv[1]}"', t)
          assert n == 1, f"__version__ 锚点命中 {n} 次（应为 1）"
          if out != t:
              p.write_text(out, encoding="utf-8")
              print(f"__version__ → {sys.argv[1]}")
          else:
              print(f"__version__ 已是 {sys.argv[1]} —— 无需改动")
          PY
          if ! git diff --quiet -- app/__init__.py; then
            git add app/__init__.py
            # 提交信息带跳过标记做兜底（GITHUB_TOKEN 推的提交本就不触发 workflow）
            git commit -q -m "chore(release): $TAG 版本号写回 [skip release]"
            git pull --rebase -q origin main
            git push origin HEAD:main
          fi
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "sha7=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "写回后提交：$SHA"

  build-and-push:
    needs: [resolve, bump]
    if: ${{ needs.resolve.outputs.mode != 'skip' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.sha }}
      - name: 登录 GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: 构建镜像（本地，先不推）
        env:
          IMAGE: ${{ needs.resolve.outputs.image }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          docker build --build-arg APP_VERSION="$VERSION" \
            -t "$IMAGE:$VERSION" -t "$IMAGE:latest" -t "$IMAGE:sha-${{ needs.bump.outputs.sha7 }}" .
          echo "版本 label 自检："
          docker inspect --format \
            '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$IMAGE:$VERSION"
      - name: 容器内冒烟（**推之前**；不过就不推）
        env:
          IMAGE: ${{ needs.resolve.outputs.image }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          # 🔴 冒烟**不带任何真实凭据**：上游指向死端口（127.0.0.1:9）——
          #    一旦有代码路径试图联网，会以连接失败/502 现形。
          docker run -d --name smoke -p 18700:8700 \
            -e BAIDU_COOKIE='BAIDUID=smoke' \
            -e BAIDU_SESSION_TOKEN='tok-smoke' -e BAIDU_LID='lid-smoke' \
            -e BAIDU_API_KEYS='sk-smoke' \
            -e BAIDU_BASE_URL='http://127.0.0.1:9' \
            -e BAIDU_LEGACY_BASE='http://127.0.0.1:9' -e BAIDU_LEGACY=fallback \
            "$IMAGE:$VERSION"
          trap 'echo "=== 冒烟失败，容器日志 ==="; docker logs smoke || true' ERR

          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:18700/healthz > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:18700/healthz | tee /tmp/health.json; echo
          # 自报版本必须 == 发布版本（证明 bump 真的进了镜像）
          python3 -c "import json;d=json.load(open('/tmp/health.json'));assert d['version']=='$VERSION',d"

          curl -sf http://127.0.0.1:18700/readyz | tee /tmp/ready.json; echo
          python3 -c "import json;d=json.load(open('/tmp/ready.json'));c=d['checks'];assert d['status']=='ok',d;assert c['cookie_configured'] is True,c;assert c['capabilities']=={'total':19,'available':19},c"

          # 能力面：免鉴权 /v1/models 列**本部署可用**的 19 条（= 全部能力；老接口补位 6 项）
          curl -sf http://127.0.0.1:18700/v1/models | tee /tmp/models.json; echo
          python3 -c "import json;d=json.load(open('/tmp/models.json'));ids=[m['id'] for m in d['data']];assert len(ids)==19,len(ids);assert 'wenxin:dewatermark' in ids,ids;assert 'wenxin:restyle' in ids,ids;assert 'wenxin:bgreplace' in ids,ids"

          # /llms.txt：免鉴权 + 从注册表派生（跑在镜像里 = 顺带证明打包完整）
          curl -sf http://127.0.0.1:18700/llms.txt | tee /tmp/llms.txt | head -3
          python3 -c "import pathlib;t=pathlib.Path('/tmp/llms.txt').read_text();assert t.startswith('# baidu-service'),t[:60];assert 'wenxin:bgreplace' in t and 'wenxin:restyle' in t;assert len(t)>3000,len(t)"

          # 鉴权接线自证：无 key 的受保护请求必须 401（在 healthz 成功之后再探）
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            http://127.0.0.1:18700/v1/images/generations -H 'Content-Type: application/json' \
            -d '{"model":"wenxin:clarity","image":"data:image/png;base64,iVBORw0KGgo="}')" = "401"

          # 遮罩类：干跑必须给出「老接口 type=8 + picInfo2」计划（零上游请求）
          curl -s -X POST http://127.0.0.1:18700/v1/images/generations \
            -H "Authorization: Bearer sk-smoke" -H 'Content-Type: application/json' \
            -d '{"model":"wenxin:erase","image":"data:image/png;base64,iVBORw0KGgo=","mask":"data:image/png;base64,iVBORw0KGgo=","dry_run":true}' \
            | tee /tmp/dry.json; echo
          python3 -c "import json;d=json.load(open('/tmp/dry.json'));assert d['dry_run'] is True,d;assert d['preview']['legacy']['type']=='8',d['preview']['legacy']"
          # 背景替换（2026-09-24 攻克）：老接口 type=12 + 遮罩 + text → 干跑计划必须带上
          curl -s -X POST http://127.0.0.1:18700/v1/images/generations \
            -H "Authorization: Bearer sk-smoke" -H 'Content-Type: application/json' \
            -d '{"model":"wenxin:bgreplace","image":"data:image/png;base64,iVBORw0KGgo=","mask":"data:image/png;base64,iVBORw0KGgo=","prompt":"大雪纷飞的街道","dry_run":true}' \
            | tee /tmp/dry_bg.json; echo
          python3 -c "import json;d=json.load(open('/tmp/dry_bg.json'));leg=d['preview']['legacy'];assert leg['type']=='12',leg;assert leg['mask'] is True and leg['text_from_prompt'] is True,leg"

          # 换风格（2026-09-24 攻克）：干跑必须给出实测形状「专属 sa + ext.style/text + TEXT(标签)」
          curl -s -X POST http://127.0.0.1:18700/v1/images/generations \
            -H "Authorization: Bearer sk-smoke" -H 'Content-Type: application/json' \
            -d '{"model":"wenxin:restyle","image":"data:image/png;base64,iVBORw0KGgo=","style":"宫崎骏风","dry_run":true}' \
            | tee /tmp/restyle.json; echo
          python3 -c "import json;d=json.load(open('/tmp/restyle.json'));s=d['preview']['body']['message']['searchInfo'];ext=json.loads(s['mcpInfo']['ext']);assert s['sa']=='workspace_piccreate_hfg',s['sa'];assert ext['style']=='miyazaki' and ext['text']=='宫崎骏风',ext;assert ext['image_source']==1,ext;assert d['effective']['query']=='宫崎骏风',d['effective']"
          # 风格非法 ⇒ 400（触网前拒，且给出 17 项候选）
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            http://127.0.0.1:18700/v1/images/generations \
            -H "Authorization: Bearer sk-smoke" -H 'Content-Type: application/json' \
            -d '{"model":"wenxin:restyle","image":"data:image/png;base64,iVBORw0KGgo=","style":"不存在"}')" = "400"
          echo "冒烟通过：起得来、版本一致、能力面/鉴权/遮罩计划/换风格形状/风格校验五条全部接线（全程零真实上游）"
          docker rm -f smoke
      - name: 推送（版本 / latest / sha- 三 tag 同一镜像）
        env:
          IMAGE: ${{ needs.resolve.outputs.image }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:sha-${{ needs.bump.outputs.sha7 }}"

  release:
    needs: [resolve, bump, build-and-push]
    if: ${{ needs.resolve.outputs.mode != 'skip' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.sha }}
          fetch-depth: 0
      - name: 打版本 tag（仅 auto 模式；人工 tag 模式用已存在的那个）
        if: ${{ needs.resolve.outputs.mode == 'auto' }}
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          # annotated tag 需要 committer 身份，而 runner 上没有全局 git 配置
          # （漏了这两行会得到 "Committer identity unknown" / exit 128）
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "!! $TAG 已存在（并发运行或人工已打）—— 报错退出，避免版本号重复"
            exit 1
          fi
          git tag -a "$TAG" -m "release $TAG"
          git push origin "refs/tags/$TAG"
      - name: 建 Release（幂等）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
          IMAGE: ${{ needs.resolve.outputs.image }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG 已存在 —— 跳过（幂等：重跑同一 tag 不变红）"
            exit 0
          fi
          if PREV=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' "${TAG}^" 2>/dev/null); then
            RANGE="${PREV}..${TAG}"
          else
            RANGE="${TAG}"
          fi
          NOTES=/tmp/notes.md
          {
            echo "容器镜像（三个 tag 指向同一镜像）："
            echo
            echo '```'
            echo "$IMAGE:$VERSION"
            echo "$IMAGE:latest"
            echo "$IMAGE:sha-${{ needs.bump.outputs.sha7 }}"
            echo '```'
            echo
            echo "变更："
            echo
            git log "$RANGE" --no-merges --max-count=50 --pretty='- %s (%h)'
          } > "$NOTES"
          gh release create "$TAG" --title "$TAG" --notes-file "$NOTES"
